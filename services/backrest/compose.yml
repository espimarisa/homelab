# Backrest: Web UI and orchestrator for Restic backups.
# https://garethgeorge.github.io/backrest/introduction/getting-started

---
services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1
    container_name: backrest
    hostname: backrest
    read_only: true # Prevent writing directly to the image.
    restart: unless-stopped
    environment:
      BACKREST_CONFIG: "/config/config.json" # Sets the config file path.
      BACKREST_DATA: "/data" # Sets the config data path.
      TMPDIR: "/tmp" # Use /tmp for temporary files.
      TZ: "${TZ}" # Sets the timezone.
      XDG_CACHE_HOME: "/cache" # Use /cache for cached files.
    expose:
      - 9898/tcp # Backrest web interface reverse proxied at backrest.${INTERNAL_DOMAIN}.
    networks:
      - internal
    volumes:
      - ./scripts:/scripts:rw # Custom scripts.
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker socket mount.
      - ${BACKUPS_PATH}:/mnt/backups:rw # Mounted local backups HDD.
      - ${DOCKER_VOLUMES_PATH}:/mnt/docker-volumes:ro # Docker volumes mount.
      - ${IMMICH_UPLOADS_PATH}:/mnt/immich-uploads:ro # Immich uploads storage directory.
      - ${OPENCLOUD_UPLOADS_PATH}:/mnt/opencloud-uploads:ro # OpenCloud uploads storage directory.
      - ${STORAGE_PATH}:/mnt/storage:ro # Root storage directory.
      - backrest-cache:/cache:rw # Backrest cache.
      - backrest-config:/config:rw # Backrest configuration.
      - backrest-data:/data:rw # Backrest data.
      - backrest-tmp:/tmp:rw # Backrest tmp files.
    cap_drop: # Drop all unneccesary priveleges.
      - AUDIT_WRITE
      - MKNOD
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 8G
    security_opt:
      - no-new-privileges:true # Prevents privelege escalation.

networks:
  internal:
    external: true
    name: internal-network

volumes:
  backrest-data:
    name: backrest-data-volume
    external: true
  backrest-cache:
    name: backrest-cache-volume
    external: true
  backrest-config:
    name: backrest-config-volume
    external: true
  backrest-tmp:
    name: backrest-tmp-volume
    external: true
