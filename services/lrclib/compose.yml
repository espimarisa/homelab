# lrclib: Self-hosted lrclib-rs server.
# https://github.com/tranxuanthang/lrclib

---
services:
  lrclib:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: lrclib
    hostname: lrclib
    read_only: true # Prevent writing directly to the image.
    restart: unless-stopped
    user: "${PUID}:${PGID}" # Run as non-root user.
    environment:
      LRCLIB_LOG: "debug" # Log in the debug level.
    ports:
      - 127.0.0.1:3300:3300/tcp
    networks:
      - external
    volumes:
      - /etc/localtime:/etc/localtime:ro # Local timezone mount.
      - lrclib:/data:rw # lrclib database storage.
    tmpfs:
      - "/tmp:uid=${PUID},gid=${PGID}" # Required for read_only image.
    cap_drop:
      - ALL # Drop all unnecessary privileges.
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 8G

networks:
  external:
    external: true
    name: external-network

volumes:
  lrclib:
    external: true
    name: lrclib-volume
